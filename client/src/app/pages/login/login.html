<div class="login-page">
  <section class="login-form">
    <a class="login-brand" href="/">GameMatch</a>
    @if (error) {
      <div class="error-state" role="alert">
        <p>{{ error }}</p>
        <button class="secondary-button" (click)="loadSignIn()">Try again</button>
      </div>
    }
    <div id="sign-in"></div>
  </section>
</div>
