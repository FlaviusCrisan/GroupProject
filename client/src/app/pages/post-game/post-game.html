<div class="post-game-container">
  <mat-card appearance="outlined" class="post-game-card">
    <mat-card-header>
      <app-icon class="header-icon" name="plus"></app-icon>
      <h1 class="header-title">Create lobby</h1>
    </mat-card-header>

    <mat-card-content class="post-form">
      <div class="form-section">
        <h3>Details</h3>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Lobby Title</mat-label>
          <input matInput placeholder="Lobby title" [(ngModel)]="info.title" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description (Optional)</mat-label>
          <textarea
            matInput
            rows="3"
            placeholder="Description"
            [(ngModel)]="info.description"
          ></textarea>
        </mat-form-field>
      </div>

      <div class="form-section">
        <h3>Game</h3>
        <app-post-info-selectors (on_changed)="update_info($event)"></app-post-info-selectors>
      </div>
    </mat-card-content>

    <div class="post-actions">
      <button class="glass-button secondary" (click)="router.navigate(['/home'])">Cancel</button>
      <button class="glass-button primary-glow" [disabled]="add_clicked" (click)="add()">
        <app-icon *ngIf="!add_clicked" name="arrow-up"></app-icon>
        {{ add_clicked ? 'Creating...' : 'Create lobby' }}
      </button>
    </div>
  </mat-card>
</div>
