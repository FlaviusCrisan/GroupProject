<svg
  viewBox="0 0 24 24"
  aria-hidden="true"
  focusable="false"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @if (brands[name]) {
    <path [attr.d]="brands[name]" fill="currentColor" stroke="none" />
  } @else {
    @switch (name) {
      @case ('teammates') {
        <circle cx="8" cy="8" r="3" />

          d="M2.5 20v-2a5.5 5.5 0 0 1 11 0v2M16 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4.5 5M19 2v3M17.5 3.5h3"

        <path d="M8 2v4M16 2v4M4 10h16M8 15l2 2 5-4" />
      }
      @case ('messages') {
        <path
          d="M4 3.5h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H9l-5 4v-4a3 3 0 0 1-2-3v-7a3 3 0 0 1 2-3ZM20 9h1a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2h-5"
        />

        <path d="M6 17a4 4 0 0 1 8 0M17 8h1M17 12h1" />

        />

        <circle cx="19" cy="12.5" r=".8" fill="currentColor" stroke="none" />
      }
      @case ('plus') {
        <path d="M12 5v14M5 12h14" />
      }
      @case ('logout') {
        <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M8 12h13M17 8l4 4-4 4" />
      }
      @case ('sun') {
        <circle cx="12" cy="12" r="4" />

          d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"

      @case ('moon') {
        <path d="M20.5 14a8.5 8.5 0 0 1-10.8-10.8A8.5 8.5 0 1 0 20.5 14Z" />
      }
      @case ('chevron') {
        <path d="m6 9 6 6 6-6" />
      }
      @case ('filter') {
        <path d="M3 6h18M3 12h18M3 18h18" />
        <circle cx="8" cy="6" r="2" fill="var(--surface-color)" />
        <circle cx="16" cy="12" r="2" fill="var(--surface-color)" />
        <circle cx="10" cy="18" r="2" fill="var(--surface-color)" />
      }
      @case ('edit') {
        <path d="m16 3 5 5-11 11-6 1 1-6L16 3ZM13 6l5 5M14 21h7" />
      }
      @case ('trash') {
        <path d="M3 6h18M9 6V3h6v3M5 6l1 14h12l1-14M10 10v6M14 10v6" />
      }
      @case ('arrow-up') {
        <path d="M12 20V4M6 10l6-6 6 6" />
      }
      @case ('globe') {
        <circle cx="12" cy="12" r="9" />
        <ellipse cx="12" cy="12" rx="4" ry="9" />
        <path d="M3 12h18" />
      }
      @case ('language') {
        <path d="M3 5h11M8 2v3M5 5c0 6 4 9 8 11M12 5c-1 6-5 9-9 11M14 21l4-10 4 10M15.5 17h5" />
      }
      @case ('info') {
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v6M12 7h.01" />
      }
      @case ('lock') {
        <rect x="5" y="10" width="14" height="11" rx="3" />
        <path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3" />
